version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These restrictions apply only to version updates. Security fixes remain enabled.
    allow:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: typescript
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: playwright
    groups:
      development-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-minor-patch:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
    # Playwright majors and major security fixes stay separate for review.
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
