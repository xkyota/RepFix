name: Prepare release PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A merged version PR must never publish or tag automatically.
          skip-github-release: true
      # GitHub requires a maintainer to approve workflows on GITHUB_TOKEN-created
      # PRs. Use that pull_request run: workflow_dispatch checks do not satisfy
      # required PR checks. See docs/releases.md; never auto-merge a release PR.
