<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>RepFix discount fixture</title>
<style>body { font: 20px system-ui; max-width: 36rem; margin: 5rem auto; } button, input { font: inherit; } output { display: block; margin: 1rem 0; }</style>
<h1>Order total</h1>
<label>Discount <input id="discount" type="number" value="0" min="0" max="1" step="0.1"></label>
<button type="button">Apply discount</button>
<output aria-label="Total">$100</output>
<script>
document.querySelector('button').addEventListener('click', () => {
  const discount = Number(document.querySelector('input').value) || 0.1;
  document.querySelector('output').textContent = `$${100 * (1 - discount)}`;
});
</script>
</html>
